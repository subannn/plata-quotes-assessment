services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quotes
      # База хранится внутри контейнера (вне VOLUME образа): переживает stop/start,
      # удаляется вместе с контейнером при docker compose down.
      PGDATA: /var/lib/postgresql-data
    ports:
      - "5435:5432"
    volumes:
      # Схема БД. Postgres применяет её при создании новой базы — в новом контейнере.
      - ./migration/init.up.sql:/docker-entrypoint-initdb.d/init.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quotes"]
      interval: 2s
      timeout: 3s
      retries: 15

  service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8080"
    volumes:
      - ./config.docker.json:/app/config.json:ro
    restart: unless-stopped
